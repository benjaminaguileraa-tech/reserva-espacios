<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Espacios Universitarios</title>
    
    <!-- Bootstrap CSS (Herramienta de apoyo) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- CSS Propio (Personalización visual) -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- Encabezado semántico -->
    <header>
        <nav class="navbar navbar-dark bg-primary shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">🎓 ReservaEspacios</a>
            </div>
        </nav>
    </header>

    <!-- Contenido principal semántico -->
   <!-- Contenido principal semántico -->
    <main class="container my-5">
        <div class="row">
            
            <!-- COLUMNA IZQUIERDA: Buscador y Espacios (Ocupa 8 de 12 espacios) -->
            <div class="col-lg-8">
                
                <!-- Sección 1: Buscador y Filtros -->
                <section class="card mb-4 shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 mb-3">Buscar Espacios</h2>
                        <form id="formulario-filtros" class="row g-3">
                            <div class="col-md-5">
                                <label for="filtro-edificio" class="form-label">Edificio</label>
                                <select id="filtro-edificio" class="form-select">
                                    <option value="todos">Todos</option>
                                    <option value="Edificio A">Edificio A</option>
                                    <option value="Edificio de Ingeniería">Edificio de Ingeniería</option>
                                    <option value="Biblioteca Central">Biblioteca Central</option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label for="filtro-tipo" class="form-label">Tipo de Espacio</label>
                                <select id="filtro-tipo" class="form-select">
                                    <option value="todos">Todos</option>
                                    <option value="Sala de clases">Sala de clases</option>
                                    <option value="Laboratorio">Laboratorio</option>
                                    <option value="Sala de estudio">Sala de estudio</option>
                                </select>
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button type="button" class="btn btn-primary w-100" id="btn-filtrar">Filtrar</button>
                            </div>
                        </form>
                    </div>
                </section>

                <!-- Sección 2: Contenedor de Tarjetas de Salas -->
                <section>
                    <h2 class="h4 mb-3">Espacios Disponibles</h2>
                    <!-- IMPORTANTE: JavaScript inyectará las tarjetas aquí adentro -->
                    <div id="contenedor-espacios" class="row g-4">
                        <p class="text-muted">Cargando espacios...</p>
                    </div>
                </section>

            </div>

            <!-- COLUMNA DERECHA: Panel de Mis Reservas (Ocupa 4 de 12 espacios) -->
            <aside class="col-lg-4">
                <div class="card shadow-sm sticky-top" style="top: 20px;">
                    <div class="card-header bg-success text-white">
                        <h2 class="h5 mb-0">Mis Reservas</h2>
                    </div>
                    <div class="card-body" id="contenedor-reservas">
                        <!-- IMPORTANTE: JavaScript inyectará las reservas aquí adentro -->
                        <p class="text-muted text-center my-3">Aún no tienes reservas activas.</p>
                    </div>
                </div>
            </aside>
            
        </div>
    </main>
    <!-- Modal de Reserva (Oculto por defecto) -->
    <div class="modal fade" id="modalReserva" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="titulo-modal">Solicitar Reserva</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="formulario-reserva">
                        <div class="mb-3">
                            <label for="fecha-reserva" class="form-label">Fecha de la reserva</label>
                            <input type="date" class="form-control" id="fecha-reserva" required>
                        </div>
                        <div class="mb-3">
                            <label for="hora-reserva" class="form-label">Horario</label>
                            <input type="time" class="form-control" id="hora-reserva" required>
                        </div>
                        <div id="mensaje-error" class="text-danger mb-3 d-none">
                            Por favor, completa todos los campos.
                        </div>
                        <button type="submit" class="btn btn-success w-100">Confirmar Reserva</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Pie de página semántico -->
    <footer class="text-center text-muted py-4">
        <small>&copy; 2026 Sistema de Reservas Universitarias</small>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- JavaScript Propio (Lógica e interacción) -->
    <script src="js/app.js"></script>
</body>
</html>
